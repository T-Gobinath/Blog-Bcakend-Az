# Port configuration for both local (default 8080) and Azure (uses PORT variable)
server.port=${PORT:8081}

# Connect to your AZURE PostgreSQL database
# It's better to move this to Azure configuration (see below)
spring.datasource.url=jdbc:postgresql://chateepost.postgres.database.azure.com:5432/user-dev?sslmode=require
spring.datasource.username=postgres
spring.datasource.password=Gobi123@

# Driver and JPA settings
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true